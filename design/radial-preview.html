<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radial Menu Preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --ink:#1d1d1f; --ink-2:rgba(29,29,31,.62); --ink-3:rgba(29,29,31,.38);
  --glass:rgba(250,250,252,.24); --glass-hub:rgba(255,255,255,.5);
  --rim:rgba(255,255,255,.85); --rim-low:rgba(255,255,255,.22);
  --lens:rgba(255,255,255,.62); --accent:#0a7cff; --sel:rgba(0,0,0,.09);
  --win:rgba(246,246,248,.80); --side:rgba(236,236,240,.62); --hair:rgba(0,0,0,.08);
  --dim:rgba(0,0,0,0); --rimAngle:-40deg; color-scheme:light;
}
:root[data-theme="dark"]{
  --ink:#f5f5f7; --ink-2:rgba(245,245,247,.66); --ink-3:rgba(245,245,247,.36);
  --glass:rgba(40,40,46,.38); --glass-hub:rgba(64,64,70,.55);
  --rim:rgba(255,255,255,.5); --rim-low:rgba(255,255,255,.08);
  --lens:rgba(255,255,255,.2); --sel:rgba(255,255,255,.1);
  --win:rgba(34,34,38,.82); --side:rgba(44,44,50,.6); --hair:rgba(255,255,255,.08);
  --dim:rgba(0,0,8,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#2b4b6a url(assets/wall.jpg) center/cover;font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;cursor:default}
body::before{content:"";position:fixed;inset:0;background:var(--dim);transition:background .4s}
::selection{background:rgba(10,124,255,.3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Finder-like window */
.win{position:absolute;left:50%;top:47%;width:min(820px,94vw);height:470px;transform:translate(-50%,-50%);border-radius:16px;overflow:hidden;display:flex;
  background:var(--win);backdrop-filter:blur(50px) saturate(180%);-webkit-backdrop-filter:blur(50px) saturate(180%);
  box-shadow:0 0 0 .5px rgba(0,0,0,.18),inset 0 .5px 0 rgba(255,255,255,.5),0 24px 70px rgba(0,0,0,.32),0 4px 14px rgba(0,0,0,.12)}
.side{width:170px;padding:44px 10px 10px;background:var(--side);border-right:.5px solid var(--hair);flex:none}
.side h6{margin:10px 8px 4px;font-size:11px;font-weight:600;color:var(--ink-3)}
.side a{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;color:var(--ink);text-decoration:none}
.side a i{font-size:16px;color:var(--accent)}
.side a.on{background:var(--sel)}
.lights{position:absolute;left:14px;top:15px;display:flex;gap:8px}
.lights span{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.tool{height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:.5px solid var(--hair)}
.tool i{font-size:18px;color:var(--ink-2)}
.tool b{font-size:14px;font-weight:600}
.tool .count{margin-left:auto;color:var(--ink-3);font-size:12px}
.files{display:grid;grid-template-columns:repeat(auto-fill,96px);gap:14px 18px;padding:22px 24px;align-content:start}
.file{display:flex;flex-direction:column;align-items:center;gap:5px}
.thumb{width:84px;height:76px;display:grid;place-items:center;border-radius:8px}
.file.sel .thumb{background:var(--sel)}
.name{max-width:96px;padding:1px 5px;border-radius:4px;font-size:12px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file.sel .name{background:var(--accent);color:#fff}
.photo{max-width:70px;max-height:56px;border:2px solid #fff;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.vid{position:relative}
.vid em{position:absolute;right:4px;bottom:4px;font:600 9px/1 -apple-system,sans-serif;font-style:normal;color:#fff;background:rgba(0,0,0,.55);padding:2px 4px;border-radius:3px}
.file.new{animation:land .5s cubic-bezier(.16,1,.3,1)}
@keyframes land{from{transform:scale(.4) translateY(-30px);opacity:0}}

/* radial menu */
#menu{position:absolute;width:300px;height:300px;margin:-150px 0 0 -150px;pointer-events:none;opacity:0;transform:scale(.55);
  transition:opacity .16s ease-out,transform .42s cubic-bezier(.16,1,.3,1)}
#menu.open{opacity:1;transform:scale(1);pointer-events:auto}
#menu.fire{transform:scale(.2);opacity:0;transition:transform .28s cubic-bezier(.5,0,.8,.3),opacity .28s}
.ring,.hub{position:absolute;border-radius:50%;background:var(--glass);
  backdrop-filter:blur(22px) saturate(210%) brightness(1.06);-webkit-backdrop-filter:blur(22px) saturate(210%) brightness(1.06);
  box-shadow:inset 0 0 0 .5px var(--rim-low),0 16px 44px rgba(0,0,0,.26),0 2px 6px rgba(0,0,0,.12)}
.ring{inset:0}
.ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from calc(var(--rimAngle) - 60deg),transparent 0deg,var(--rim) 60deg,transparent 120deg,transparent 180deg,var(--rim-low) 240deg,transparent 300deg);
  -webkit-mask:radial-gradient(circle,transparent calc(50% - 1.6px),#000 calc(50% - 1px));mask:radial-gradient(circle,transparent calc(50% - 1.6px),#000 calc(50% - 1px));transition:--rimAngle .3s}
.hub{left:50%;top:50%;width:92px;height:92px;margin:-46px 0 0 -46px;background:var(--glass-hub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;
  box-shadow:inset 0 .5px 0 var(--rim),inset 0 0 0 .5px var(--rim-low),0 6px 16px rgba(0,0,0,.18)}
.hub .stack{position:relative;width:34px;height:30px}
.hub .stack svg{position:absolute;left:6px;top:0}
.hub .stack svg:first-child{transform:rotate(-9deg) translateX(-5px)}
.hub .stack svg:last-child{transform:rotate(7deg) translateX(5px)}
.hub b{font-size:11px;font-weight:600;letter-spacing:-.01em}
.hub i{font-size:24px}
.hub .back{font-size:10px;color:var(--ink-2);display:flex;align-items:center;gap:1px}
.hub .back i{font-size:11px}
.lens{position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:50%;background:var(--lens);opacity:0;
  box-shadow:inset 0 .5px 0 var(--rim),inset 0 -.5px 0 var(--rim-low),0 4px 12px rgba(0,0,0,.12);
  transition:transform .34s cubic-bezier(.16,1,.3,1),opacity .15s}
.item{position:absolute;width:72px;margin:-25px 0 0 -36px;text-align:center;pointer-events:none;color:var(--ink-2);transition:color .15s,transform .2s cubic-bezier(.16,1,.3,1)}
.item i{display:block;font-size:22px;margin-bottom:3px;color:var(--ink)}
.item span{font-size:11px;font-weight:500}
.item.hot{color:var(--ink);transform:scale(1.06)}
.item.hot i{color:var(--accent)}
.item.off{opacity:.3}
.swap .item{opacity:0;transform:scale(.8) rotate(-8deg)}
.caption{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);white-space:nowrap;font-size:12px;color:var(--ink);padding:6px 12px;border-radius:999px;
  background:var(--glass-hub);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:inset 0 0 0 .5px var(--rim-low),0 6px 18px rgba(0,0,0,.16);
  opacity:0;transition:opacity .15s}
.caption.on{opacity:1}
.caption kbd{font:600 11px/1 -apple-system,sans-serif;padding:2px 5px;margin-left:6px;border-radius:4px;background:var(--sel);color:var(--ink-2)}

/* chrome around the preview */
.help{position:absolute;left:24px;bottom:20px;color:rgba(255,255,255,.92);font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.help kbd{font:600 11px/1 -apple-system,sans-serif;padding:3px 6px;border-radius:5px;background:rgba(255,255,255,.22);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2);margin:0 2px}
.seg{position:absolute;top:16px;right:16px;display:flex;padding:2px;border-radius:8px;background:rgba(0,0,0,.22);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.seg button{border:0;background:none;color:#fff;font:500 12px -apple-system,sans-serif;padding:4px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.3)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="seg" role="group" aria-label="Appearance">
  <button data-t="light" aria-pressed="true">Light</button><button data-t="dark" aria-pressed="false">Dark</button>
</div>

<div class="win">
  <div class="lights"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
  <nav class="side">
    <h6>Favorites</h6>
    <a href="#"><i class="ti ti-download"></i>Downloads</a>
    <a href="#"><i class="ti ti-device-desktop"></i>Desktop</a>
    <a href="#" class="on"><i class="ti ti-file-text"></i>Documents</a>
    <a href="#"><i class="ti ti-apps"></i>Applications</a>
    <h6>Locations</h6>
    <a href="#"><i class="ti ti-cloud"></i>iCloud Drive</a>
  </nav>
  <section class="main">
    <div class="tool"><i class="ti ti-chevron-left"></i><i class="ti ti-chevron-right" style="opacity:.4"></i><b>Documents</b><span class="count" id="count"></span></div>
    <div class="files" id="files"></div>
  </section>
</div>

<p class="help"><kbd>⌥</kbd><kbd>Space</kbd> open · <kbd>1</kbd>–<kbd>7</kbd> pick · <kbd>esc</kbd> back · click a file to select, click empty space to open the menu</p>

<div id="menu" aria-hidden="true">
  <div class="ring"></div>
  <div class="lens" id="lens"></div>
  <div id="items"></div>
  <div class="hub" id="hub" role="button" aria-label="Back"></div>
  <div class="caption" id="caption"></div>
</div>

<script>
const page=(label,tint,lines=true)=>`<svg width="46" height="58" viewBox="0 0 46 58" aria-hidden="true">
  <path d="M3 1.5h28l13.5 13.5v39.5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-51a2 2 0 0 1 2-2z" fill="#fff" stroke="rgba(0,0,0,.16)"/>
  <path d="M31 1.5v11.5a2 2 0 0 0 2 2h11.5" fill="#f2f2f4" stroke="rgba(0,0,0,.16)"/>
  ${lines?'<g stroke="#d6d6dc" stroke-width="1.6"><path d="M8 20h28M8 25h30M8 30h24M8 35h30M8 40h18"/></g>':''}
  <text x="23" y="52" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="8" font-weight="700" fill="${tint}">${label}</text></svg>`;
const wave=`<svg width="46" height="58" viewBox="0 0 46 58" aria-hidden="true"><path d="M3 1.5h28l13.5 13.5v39.5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-51a2 2 0 0 1 2-2z" fill="#fff" stroke="rgba(0,0,0,.16)"/><path d="M31 1.5v11.5a2 2 0 0 0 2 2h11.5" fill="#f2f2f4" stroke="rgba(0,0,0,.16)"/><g stroke="#ff375f" stroke-width="2" stroke-linecap="round"><path d="M10 30v4M15 25v14M20 21v22M25 27v10M30 23v18M35 29v6"/></g><text x="23" y="52" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="8" font-weight="700" fill="#8e8e93">M4A</text></svg>`;
const ART={pdf:()=>page('PDF','#d70015'),png:()=>`<img class="photo" src="assets/tree.jpg" alt="">`,jpg:()=>`<img class="photo" src="assets/beach.jpg" alt="">`,
  heic:()=>`<img class="photo" src="assets/beach.jpg" alt="">`,mp4:()=>`<span class="vid"><img class="photo" src="assets/tree.jpg" alt=""><em>0:03</em></span>`,m4a:()=>wave,
  zip:()=>page('ZIP','#8e8e93',false),webp:()=>`<img class="photo" src="assets/beach.jpg" alt="">`,gif:()=>`<img class="photo" src="assets/tree.jpg" alt="">`,mp3:()=>wave,txt:()=>page('TXT','#8e8e93')};
const files=[['report.pdf',1],['scan.pdf',1],['beach.heic'],['logo.png'],['clip.mp4'],['voice.m4a']];
const ext=n=>n.split('.').pop(),base=n=>n.replace(/\.[^.]+$/,'');
function drawFiles(){const el=document.getElementById('files');el.innerHTML='';
  files.forEach(([n,s,isNew],i)=>{const d=document.createElement('div');d.className='file'+(s?' sel':'')+(isNew?' new':'');
    d.innerHTML=`<div class="thumb">${(ART[ext(n)]||ART.txt)()}</div><div class="name">${n}</div>`;
    d.onclick=e=>{e.stopPropagation();if(!e.metaKey&&!e.shiftKey)files.forEach(f=>f[1]=0);files[i][1]=files[i][1]?0:1;files.forEach(f=>f[2]=0);drawFiles()};el.appendChild(d)});
  const sel=files.filter(f=>f[1]).length;document.getElementById('count').textContent=sel?`${sel} of ${files.length} selected`:`${files.length} items`}

const KIND={pdf:'pdf',png:'image',jpg:'image',heic:'image',webp:'image',gif:'image',mp4:'video',m4a:'audio',mp3:'audio'};
const A={
 pdf:{label:'PDF',icon:'ti-file-type-pdf',items:[
   ['Merge','ti-arrows-join',s=>s.length>1?`${base(s[0])}-merged.pdf`:null],['Split','ti-cut',s=>`${base(s[0])}-p1.pdf`],
   ['Compress','ti-arrows-diagonal-minimize-2',s=>`${base(s[0])}-small.pdf`],['Rotate','ti-rotate-clockwise',s=>`${base(s[0])}-rotated.pdf`],
   ['To JPG','ti-file-type-jpg',s=>`${base(s[0])}-1.jpg`],['To PNG','ti-file-type-png',s=>`${base(s[0])}-1.png`],['Text','ti-align-left',s=>`${base(s[0])}.txt`]]},
 image:{label:'Image',icon:'ti-photo',items:[
   ['To JPG','ti-file-type-jpg',s=>`${base(s[0])}.jpg`],['To PNG','ti-file-type-png',s=>`${base(s[0])}.png`],['To PDF','ti-file-type-pdf',s=>`${base(s[0])}.pdf`],
   ['To WebP','ti-world',s=>`${base(s[0])}.webp`],['Half size','ti-resize',s=>`${base(s[0])}-half.${ext(s[0])}`],['Compress','ti-arrows-diagonal-minimize-2',s=>`${base(s[0])}-small.jpg`],
   ['Strip info','ti-map-pin-off',s=>`${base(s[0])}-clean.${ext(s[0])}`]]},
 video:{label:'Video',icon:'ti-movie',items:[['To MP4','ti-movie',s=>`${base(s[0])}.mp4`],['To GIF','ti-gif',s=>`${base(s[0])}.gif`],['Compress','ti-arrows-diagonal-minimize-2',s=>`${base(s[0])}-small.mp4`],['Audio only','ti-music',s=>`${base(s[0])}.m4a`]]},
 audio:{label:'Audio',icon:'ti-music',items:[['To MP3','ti-music',s=>`${base(s[0])}.mp3`],['To M4A','ti-music',s=>`${base(s[0])}.m4a`],['To WAV','ti-wave-sine',s=>`${base(s[0])}.wav`]]},
 general:{label:'General',icon:'ti-bolt',items:[['Zip','ti-file-zip',s=>s.length>1?'Archive.zip':`${base(s[0])}.zip`],['Copy path','ti-clipboard',null],['New folder','ti-folder-plus',null],['Add date','ti-calendar',s=>`${base(s[0])} 2026-11-10.${ext(s[0])}`]]}};

const R=104,C=150,menu=document.getElementById('menu'),itemsEl=document.getElementById('items'),hub=document.getElementById('hub'),lens=document.getElementById('lens'),cap=document.getElementById('caption');
let level='root',hot=-1,lensAngle=0,list=[];
const selected=()=>files.filter(f=>f[1]).map(f=>f[0]);
function rootList(){const kinds=new Set(selected().map(n=>KIND[ext(n)]));
  return ['pdf','image','video','audio','general'].map(k=>({label:A[k].label,icon:A[k].icon,go:k,off:k!=='general'&&!kinds.has(k)}))}
function render(){
  const s=selected();
  list=level==='root'?rootList():A[level].items.map(([label,icon,out])=>({label,icon,out,off:out&&!out(s)}));
  itemsEl.innerHTML='';const n=list.length;
  list.forEach((it,i)=>{const a=i*2*Math.PI/n,d=document.createElement('div');d.className='item'+(it.off?' off':'');
    d.style.left=C+R*Math.sin(a)+'px';d.style.top=C-R*Math.cos(a)+'px';d.innerHTML=`<i class="ti ${it.icon}"></i><span>${it.label}</span>`;itemsEl.appendChild(d)});
  if(level==='root'){const pdfs=s.filter(n=>ext(n)==='pdf').length,thumbs=s.slice(0,2).map(n=>`<svg width="22" height="28" viewBox="0 0 46 58"><path d="M3 1.5h28l13.5 13.5v39.5a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-51a2 2 0 0 1 2-2z" fill="#fff" stroke="rgba(0,0,0,.25)" stroke-width="2"/><g stroke="#d6d6dc" stroke-width="3"><path d="M8 22h28M8 30h30M8 38h22"/></g></svg>`).join('');
    hub.innerHTML=`<div class="stack">${thumbs}</div><b>${s.length===pdfs?`${s.length} PDF${s.length>1?'s':''}`:`${s.length} file${s.length>1?'s':''}`}</b>`;hub.setAttribute('aria-label','Close')}
  else{hub.innerHTML=`<i class="ti ${A[level].icon}"></i><span class="back"><i class="ti ti-chevron-left"></i>${A[level].label}</span>`;hub.setAttribute('aria-label','Back')}
  setHot(-1)}
function setHot(i){if(i>=0&&list[i].off)i=-1;hot=i;
  itemsEl.querySelectorAll('.item').forEach((d,k)=>d.classList.toggle('hot',k===i));
  if(i<0){lens.style.opacity=0;cap.classList.remove('on');return}
  const target=i*360/list.length,delta=((target-lensAngle)%360+540)%360-180;lensAngle+=delta;
  lens.style.transform=`rotate(${lensAngle}deg) translateY(${-R}px) rotate(${-lensAngle}deg)`;lens.style.opacity=1;
  document.documentElement.style.setProperty('--rimAngle',lensAngle+'deg');
  const it=list[i],out=it.out&&it.out(selected());
  cap.innerHTML=(level==='root'?`${it.label} actions`:out?`Creates <b>${out}</b>`:it.label==='Copy path'?'Copies the file path':'Moves files into a new folder')+`<kbd>${i+1}</kbd>`;cap.classList.add('on')}
function sliceAt(e){const r=menu.getBoundingClientRect(),dx=e.clientX-r.left-C,dy=e.clientY-r.top-C;if(Math.hypot(dx,dy)<46)return -1;
  const n=list.length,a=(Math.atan2(dx,-dy)+2*Math.PI+Math.PI/n)%(2*Math.PI);return Math.floor(a/(2*Math.PI/n))%n}
function go(l){menu.classList.add('swap');setTimeout(()=>{level=l;render();requestAnimationFrame(()=>menu.classList.remove('swap'))},120)}
function pick(i){const it=list[i];if(!it||it.off)return;
  if(level==='root')return go(it.go);
  const out=it.out&&it.out(selected());menu.classList.add('fire');
  setTimeout(()=>{close();menu.classList.remove('fire');if(out){files.forEach(f=>{f[1]=0;f[2]=0});files.push([out,1,1]);drawFiles()}},280)}
function open(x,y){if(!selected().length)return;menu.style.left=x+'px';menu.style.top=y+'px';level='root';render();menu.classList.add('open');menu.setAttribute('aria-hidden','false')}
function close(){menu.classList.remove('open');menu.setAttribute('aria-hidden','true');cap.classList.remove('on')}
function back(){level==='root'?close():go('root')}
menu.addEventListener('mousemove',e=>setHot(sliceAt(e)));
menu.addEventListener('mouseleave',()=>setHot(-1));
menu.addEventListener('click',e=>{e.stopPropagation();const i=sliceAt(e);i<0?back():pick(i)});
document.addEventListener('click',e=>{if(e.target.closest('.seg'))return;menu.classList.contains('open')?close():open(e.clientX,e.clientY)});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.altKey){e.preventDefault();const s=document.querySelector('.file.sel .thumb');const r=s?s.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};open(r.left+r.width/2+60,r.top+r.height/2+90);return}
  if(!menu.classList.contains('open'))return;const n=list.length;
  if(e.key==='Escape')back();else if(/^[1-9]$/.test(e.key))pick(+e.key-1);
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){let k=hot;do k=(k+1)%n;while(list[k].off);setHot(k)}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){let k=hot<0?0:hot;do k=(k-1+n)%n;while(list[k].off);setHot(k)}
  else if(e.key==='Enter'&&hot>=0)pick(hot)});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.t;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
drawFiles();
setTimeout(()=>{const r=document.querySelector('.file.sel .thumb').getBoundingClientRect();open(r.right+70,r.bottom+80)},300);
</script>
</body>
</html>
